[project]
name = "quchebi"
version = "0.1.0"
description = "Quchebi: offline search of Tbilisi streets and toponyms for the Runcity game (data pipeline)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "requests>=2.32",
    "shapely>=2.1",
    "osmium>=4.0",
    "jsonschema>=4.23",
    "pdfminer.six>=20250327",
    "pypdf>=5.4",
    "pmtiles>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
exclude-newer = "2026-05-01T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
